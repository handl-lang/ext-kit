[package]
name = "hnl-ext-kit"
version = "0.1.0"
edition = "2024"
description = "`hnl gen-grammar` + `hnl kit` — kit tooling as a dynamic `hnl` extension (ADR-0149)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-kit"
homepage = "https://handl-lang.github.io/docs/ext-kit/"
documentation = "https://handl-lang.github.io/docs/ext-kit/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-kit (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_kit.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-host-tooling = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-prelude = { git = "https://github.com/handl-lang/kit-prelude", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-kit = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1
